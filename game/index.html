<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a tiny kitchen rush game</title>
<style>
  html, body { margin: 0; padding: 0; background: #241a12; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", Verdana, sans-serif; }
  #wrap { position: relative; width: min(100vw, 160vh); aspect-ratio: 1280 / 800; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; box-shadow: 0 12px 48px rgba(0,0,0,.6); }
  #help {
    position: absolute; left: 10px; bottom: 8px; color: #fff8ea; font-size: 12px;
    background: rgba(0,0,0,.45); padding: 5px 10px; border-radius: 8px; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="800"></canvas>
    <div id="help">Move: WASD / arrows &nbsp;·&nbsp; Interact: E or Space &nbsp;·&nbsp; Click a station to use it &nbsp;·&nbsp; M: mute &nbsp;·&nbsp; R: restart</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
